name: Deploy to AWS

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    us-east-1
      STACK_NAME:            WatersContractStack
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python 3.11 ───────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            infra/requirements.txt

      # ── 3. Node 22 ───────────────────────────────────────────────────────────
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ── 4. Install CDK CLI ───────────────────────────────────────────────────
      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      # ── 5. Install CDK Python deps ───────────────────────────────────────────
      - name: Install CDK Python dependencies
        run: pip install -r infra/requirements.txt

      # ── 6. Build Lambda layer ────────────────────────────────────────────────
      - name: Build Lambda dependency layer
        run: |
          mkdir -p backend/lambda_layer/python
          pip install \
            --target backend/lambda_layer/python \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.11 \
            --only-binary=:all: \
            --upgrade \
            -r backend/requirements.txt

      # ── 7. CDK bootstrap ─────────────────────────────────────────────────────
      # --quiet flag removed — not supported in all CDK versions
      - name: CDK bootstrap
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          cdk bootstrap aws://$ACCOUNT/us-east-1
        working-directory: infra

      # ── 8. First CDK deploy (infra only, placeholder frontend) ───────────────
      # CDK BucketDeployment requires frontend/dist/ to exist at synth time.
      # We create a placeholder here; the real build replaces it in step 12.
      - name: Create placeholder frontend dist
        run: |
          mkdir -p frontend/dist
          echo "<html><body>Deploying...</body></html>" > frontend/dist/index.html

      - name: Deploy CDK stack (first pass — creates infra + gets CloudFront URL)
        run: |
          cdk deploy $STACK_NAME \
            --require-approval never \
            --outputs-file cdk-outputs.json
        working-directory: infra

      # ── 9. Read CloudFront URL from CDK outputs ───────────────────────────────
      - name: Read CDK outputs
        id: cdk
        run: |
          python3 << 'PYEOF'
          import json, os

          with open("infra/cdk-outputs.json") as f:
              outputs = json.load(f)

          stack = outputs["WatersContractStack"]
          cf_url  = stack["CloudFrontURL"]
          bucket  = stack["FrontendBucketName"]
          dist_id = stack["CloudFrontDistributionId"]

          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              gh.write(f"cloudfront_url={cf_url}\n")
              gh.write(f"frontend_bucket={bucket}\n")
              gh.write(f"distribution_id={dist_id}\n")

          print(f"CloudFront URL:   {cf_url}")
          print(f"Frontend bucket:  {bucket}")
          print(f"Distribution ID:  {dist_id}")
          PYEOF

      # ── 10. Install frontend deps ─────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # ── 11. Build React app with real CloudFront URL ──────────────────────────
      - name: Build React frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ steps.cdk.outputs.cloudfront_url }}

      # ── 12. Second CDK deploy (syncs real frontend build to S3) ──────────────
      - name: Deploy CDK stack (second pass — syncs real frontend)
        run: |
          cdk deploy $STACK_NAME \
            --require-approval never \
            --outputs-file cdk-outputs.json
        working-directory: infra

      # ── 13. Sync frontend directly to S3 (faster than CDK BucketDeployment) ──
      - name: Sync frontend to S3
        run: |
          # Hashed assets — cache 1 year (Vite content-hashes filenames)
          aws s3 sync frontend/dist/ s3://${{ steps.cdk.outputs.frontend_bucket }}/ \
            --delete \
            --exclude "*.html" \
            --cache-control "public, max-age=31536000, immutable"

          # HTML — no cache (always fresh)
          aws s3 sync frontend/dist/ s3://${{ steps.cdk.outputs.frontend_bucket }}/ \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      # ── 14. Invalidate CloudFront cache ───────────────────────────────────────
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cdk.outputs.distribution_id }} \
            --paths "/*"
          echo "Cache invalidated"

      # ── 15. Summary ───────────────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "========================================================"
          echo "  Deployment complete"
          echo "  Live URL: ${{ steps.cdk.outputs.cloudfront_url }}"
          echo "========================================================"
          curl -sf "${{ steps.cdk.outputs.cloudfront_url }}/api/health" \
            && echo "  API healthy" \
            || echo "  API warming up..."
